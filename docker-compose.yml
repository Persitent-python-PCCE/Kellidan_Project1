services:
  flask:
    build: .
    container_name: flask-app
    ports:
      - "3000:5000"
    environment:
      MYSQL_DB_URL: "mysql+pymysql://root:root@mysql:3306/testdb"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app-network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - flask
    networks:
      - app-network

  mysql:
    image: mysql:9.6.0
    container_name: mysql_dbs
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: testdb
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:

networks:
  app-network: