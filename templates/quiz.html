{% extends "base.html" %}
{% block content %}
<h2>Quiz: {{ quiz.title }}</h2>
<form action="{{ url_for('quiz.attempt_quiz', quiz_id=quiz.id) }}" method="POST">
    {% for q in quiz.questions %}
    <div class="card mb-3 p-3">
        <p class="fw-bold">{{ loop.index }}. {{ q.question_text }}</p>
        <div><input type="radio" name="{{ q.id }}" value="A"> A) {{ q.option_a }}</div>
        <div><input type="radio" name="{{ q.id }}" value="B"> B) {{ q.option_b }}</div>
        <div><input type="radio" name="{{ q.id }}" value="C"> C) {{ q.option_c }}</div>
        <div><input type="radio" name="{{ q.id }}" value="D"> D) {{ q.option_d }}</div>
    </div>
    {% endfor %}
    <button type="submit" class="btn btn-primary">Submit Quiz</button>
</form>
{% endblock %}
